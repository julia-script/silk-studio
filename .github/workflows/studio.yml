name: Studio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: Studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: Formatting, generated sources, contracts and CPU workloads
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux window headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols libglfw3-dev libvulkan1
      - uses: ./.github/actions/setup-silk
      - run: silk task setup-ci
      - name: Formatting, embedded assets, browser exports, contracts and release CPU timings
        shell: bash
        run: |
          mkdir -p build/test-results
          silk task check 2>&1 | tee build/test-results/cpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-cpu
          path: build/test-results
          retention-days: 14
  native:
    name: Native window (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            setup: --linux-gpu
          - os: macos-26
            setup: ''
          - os: windows-2025-vs2026
            setup: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux window hosts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols libglfw3-dev libvulkan1 xvfb xauth weston
      - uses: ./.github/actions/setup-silk
      - run: silk task setup-ci ${{ matrix.setup }}
      # Linux checks X11 and Wayland; macOS and Windows open a real window.
      - name: Rectangle click and Tab against the CPU reference
        shell: bash
        run: |
          mkdir -p build/test-results
          silk task native check --release 2>&1 | tee build/test-results/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-native-${{ matrix.os }}
          path: build/test-results
          retention-days: 14
  browser:
    name: Browser input and localStorage
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols xvfb xauth
      - uses: ./.github/actions/setup-silk
      - name: Select existing Chromium
        run: silk task setup-ci --browser
      # Ubuntu's AppArmor profile denies unprivileged user namespaces, which Chromium's sandbox
      # needs. Without this Chromium aborts at startup with "No usable sandbox".
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Reference, Rectangle click, wheel and localStorage reload
        shell: bash
        run: |
          mkdir -p build/test-results
          silk task browser test -- --width 1280 --height 800 --click --click-x 603 --click-y 723 --stored studio 2>&1 | tee build/test-results/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser
          path: build/test-results
          retention-days: 14
