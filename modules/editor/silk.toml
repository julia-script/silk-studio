[package]
name = "silk-studio-native"
description = "Silk Studio, a design editor on the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["model", "view", "editing", "samples", "format", "render", "exports"]

[dependencies]
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "7f0b544ec662c1ebeaf212a5b2de453be0dd2ae5", path = "modules/app", package = "ui-app" }
ui_components = { git = "https://github.com/silk-lang/lib-ui.git", rev = "7f0b544ec662c1ebeaf212a5b2de453be0dd2ae5", path = "modules/components", package = "ui-components" }
ui_tree = { git = "https://github.com/silk-lang/lib-ui.git", rev = "7f0b544ec662c1ebeaf212a5b2de453be0dd2ae5", path = "modules/tree", package = "ui-tree" }
ui_scene = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/ui_scene", package = "graphics-ui-scene" }
editor = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/editor", package = "graphics-editor" }
atlas = { git = "https://github.com/silk-lang/lib-graphics.git", rev = "1abcea13ffb39947c7375c196fc6e66b604ba741", path = "modules/atlas", package = "graphics-atlas" }
