[package]
name = "silk-studio-native"
description = "Silk Studio, a design editor on the UI stack"
version = "0.1.0"
silk-version = "0.1.0-dev.64+8214c402307b"
kind = "library"
exports = ["model", "view", "editing", "samples", "format", "render", "exports"]

[dependencies]
ui_app = { git = "https://github.com/silk-lang/lib-ui.git", rev = "f3f4bf17f7020f1da724365a9fdd4a8d7a6bd0fb", path = "modules/app", package = "ui-app" }
ui_components = { git = "https://github.com/silk-lang/lib-ui.git", rev = "f3f4bf17f7020f1da724365a9fdd4a8d7a6bd0fb", path = "modules/components", package = "ui-components" }
